<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dominion of Desire</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="game-container">
    
    <!-- SETUP SCREEN -->
    <div id="setup-screen" class="screen active">
      <h1 class="title">Dominion of Desire</h1>
      <p class="subtitle">A Game of Intimacy & Strategic Territory</p>

      <form id="setup-form" class="card">
        <div class="form-group">
          <label class="section-label">Player Names</label>
          <div class="input-row">
            <input type="text" id="p1-name" value="Player 1" placeholder="Player 1" required>
            <input type="text" id="p2-name" value="Player 2" placeholder="Player 2" required>
          </div>
        </div>

        <div class="form-group">
          <label class="section-label">Game Length</label>
          <div class="segmented-control">
            <input type="radio" id="len-short" name="gameLength" value="short" checked>
            <label for="len-short">Short (18 Tiles)</label>
            <input type="radio" id="len-long" name="gameLength" value="long">
            <label for="len-long">Long (24 Tiles)</label>
          </div>
        </div>

        <div class="form-group">
          <label class="section-label">Intensity Level</label>
          <div class="segmented-control">
            <input type="radio" id="intensity-romantic" name="intensity" value="romantic" checked>
            <label for="intensity-romantic">Romantic</label>
            <input type="radio" id="intensity-sensual" name="intensity" value="sensual">
            <label for="intensity-sensual">Sensual</label>
            <input type="radio" id="intensity-erotic" name="intensity" value="erotic">
            <label for="intensity-erotic">Erotic</label>
          </div>
        </div>

        <button type="submit" class="btn-primary">Start Game</button>
      </form>
    </div>

    <!-- GAMEPLAY SCREEN -->
    <div id="game-screen" class="screen">
      <header class="game-header">
        <div id="turn-badge" class="turn-badge p1-turn">Player 1's Turn</div>
      </header>

      <div class="board-wrapper">
        <div id="board-container"></div>
      </div>

      <div class="controls-panel">
        <div id="dice-display" class="dice-display">1</div>
        <button id="roll-btn" class="btn-primary">Roll (1-3)</button>
      </div>
    </div>

  </div>

  <!-- TILE CARD MODAL -->
  <div id="card-modal" class="modal-overlay">
    <div class="modal-card">
      <h2 id="modal-tile-title">Tile Name</h2>
      <div id="modal-intensity-tag" class="intensity-tag">ROMANTIC</div>
      
      <div class="card-section">
        <span class="card-section-label">Task:</span>
        <p id="modal-task-text" class="card-task-text">Task details will appear here...</p>
      </div>

      <button id="close-modal-btn" class="btn-primary">Complete & Continue</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
