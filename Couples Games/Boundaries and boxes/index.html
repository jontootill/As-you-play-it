<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boundaries and Boxes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Boundaries and Boxes</h1>

    <!-- ========== FRONT / SETUP SCREEN ========== -->
    <div id="setup-screen">
      <div class="section">
        <label class="section-title" for="p1-name">Players</label>
        <div class="input-row">
          <input type="text" id="p1-name" placeholder="Player 1" maxlength="14">
          <input type="text" id="p2-name" placeholder="Player 2" maxlength="14">
        </div>
      </div>

      <div class="section">
        <label class="section-title">Spice Level</label>
        <div class="grid-options-3col" id="intensity-group">
          <button type="button" class="option-btn selected" data-value="romantic">Romantic</button>
          <button type="button" class="option-btn" data-value="sensual">Sensual</button>
          <button type="button" class="option-btn" data-value="erotic">Erotic</button>
        </div>
      </div>

      <div class="section">
        <label class="section-title">Grid Size</label>
        <div class="grid-options-4col" id="grid-size-group">
          <button type="button" class="option-btn" data-value="3">3 × 3</button>
          <button type="button" class="option-btn" data-value="4">4 × 4</button>
          <button type="button" class="option-btn" data-value="5">5 × 5</button>
          <button type="button" class="option-btn selected" data-value="6">6 × 6</button>
        </div>
      </div>

      <div class="section controls-row">
        <button type="button" id="start-game-btn" class="primary-btn">Start Game</button>
      </div>
    </div>

    <!-- ========== GAMEPLAY SCREEN ========== -->
    <div id="game-screen" class="hidden">
      <div id="game-status-panel" class="status-panel">
        <div id="turn-indicator" class="turn-indicator">Current Turn: <strong>Player 1</strong></div>
        <div id="score-board" class="score-board">
          <span><span id="p1-label">Player 1</span>: <strong id="score-p1">0</strong></span>
          <span><span id="p2-label">Player 2</span>: <strong id="score-p2">0</strong></span>
          <span>Boxes: <strong id="boxes-progress">0 / 36</strong></span>
        </div>
      </div>

      <!-- Two contrasting choices: Body Part A + 1 Action vs. Different Body Part B + 1 Action -->
      <div id="challenge-card" class="challenge-card hidden">
        <h3 id="challenge-title">Box Completed!</h3>
        <p id="challenge-subtitle">Choose one body part and action:</p>
        <div id="choice-container" class="choice-container">
          <button type="button" id="option-a-btn" class="challenge-choice-btn"></button>
          <button type="button" id="option-b-btn" class="challenge-choice-btn"></button>
        </div>
        <button type="button" id="close-challenge-btn" class="secondary-btn hidden">Continue Game</button>
      </div>

      <!-- Dynamic Grid Canvas -->
      <div class="canvas-container">
        <canvas id="gameCanvas" width="380" height="380"></canvas>
      </div>

      <div class="section controls-row">
        <button type="button" id="reset-game-btn" class="primary-btn">Reset / Change Settings</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
